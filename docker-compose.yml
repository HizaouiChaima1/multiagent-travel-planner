# Démarre tout le projet : docker compose up --build
#   Frontend  -> http://localhost:5173
#   Backend   -> http://localhost:8000  (documentation : /docs)
#   PostgreSQL -> localhost:5432
#
# Configuration : cp .env.example .env (non versionné).
# Sans fichier .env, les valeurs par défaut ci-dessous sont utilisées.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Clé d'équipe Mistral : à mettre dans le fichier .env (non versionné).
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      # 1 = agents sans appel au LLM (démo sans clé Mistral).
      PLANNER_MOCK: ${PLANNER_MOCK:-0}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret-at-least-32-bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel}@db:5432/${POSTGRES_DB:-travel}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Code monté en volume + --reload : les modifications sont prises en compte sans rebuild.
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    environment:
      # Nécessaire pour que le rechargement à chaud fonctionne sous Windows / macOS.
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Garde les node_modules installés dans l'image (non écrasés par le volume ci-dessus).
      - /app/node_modules

volumes:
  pgdata:
